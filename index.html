<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>PoseiOS</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="./images/trident.png" />

  <body>
    <!-- top bar -->
    <div class="top-bar" id="top-bar">
      <p class="open-button" id="welcome-open-button">PoseiOS</p>
      <p id="time"></p>
    </div>

    <!-- app icons -->
    <div id="poseidon-md-app">
      <div class="open-button desktopApp-content" id="poseidon-md-open-button">
        <img src="./images/trident.png" alt="tridentLogo" />
      </div>
      <p>Poseidon.md</p>
    </div>

    <!-- windows -->
    <div style="display: none" class="window" id="poseidon-md">
      <div class="window-handle" id="poseidon-md-handle">
        <div class="close-button" id="poseidon-md-close-button">X</div>
        <p class="header-text">Poseidon.md</p>
      </div>
      <div class="poseidon-md-sidebar">
        <p>Your First Note</p>
      </div>
      <div class="poseidon-md-content">
        <p>New Note</p>
        <p>09/6/2026</p>
        <blockquote contenteditable="true">text woohoo</blockquote>
      </div>
    </div>
