<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoseiOS</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="icon" type="image/x-icon" href="./images/trident.png" />
    <!-- for water ripple animation -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@<v0.186.1>/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@<v0.186.1>/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="wallpaper"></canvas>
    <!-- top bar -->
    <div class="top-bar" id="top-bar">
      <p class="open-button" id="welcome-open-button">PoseiOS</p>
      <p id="time"></p>
    </div>

    <!-- app icons -->
    <div id="poseidon-md-app">
      <div class="open-button desktop-app" id="poseidon-md-open-button">
        <img src="./images/trident.png" draggable="false" alt="tridentLogo" />
        <p>Poseidon.md</p>
      </div>
    </div>
    <div id="poseidon-book-app">
      <div class="open-button desktop-app" id="poseidon-book-open-button">
        <img src="./images/book.png" draggable="false" alt="bookLogo" />
        <p>Books</p>
      </div>
    </div>

    <!-- windows -->
    <div class="window" id="welcome-window">
      <div class="window-handle" id="window-handle">
        <div class="close-button" id="welcome-close-button"></div>
      </div>
      <div class="main-window-content">
        <div class="welcome-window-title">Welcome to PoseiOS</div>
        <p>Explore Poseidon's Lore.</p>
        <p>Discover greek fantasy books about Poseidon.</p>
      </div>
    </div>

    <div style="display: none" class="window" id="poseidon-md">
      <div class="window-handle" id="poseidon-md-handle">
        <div class="close-button" id="poseidon-md-close-button"></div>
        <!--empty div to make the header text centered-->
        <p class="header-text">Poseidon.md</p>
        <div></div>
      </div>
      <div class="poseidon-md-sidebar" id="poseidon-md-sidebar"></div>
      <div class="poseidon-md-content" id="poseidon-md-content"></div>
    </div>

    <div style="display: none" class="window" id="poseidon-book">
      <div class="window-handle" id="poseidon-book-handle">
        <div class="close-button" id="poseidon-book-close-button"></div>
        <p class="header-text">Books</p>
        <div></div>
      </div>
      <div class="poseidon-book-sidebar" id="poseidon-book-sidebar"></div>
      <div class="poseidon-book-content" id="poseidon-book-content"></div>
    </div>

    <div style="display: none" class="window" id="timer-window">
      <div class="window-handle" id="timer-window-handle">
        <div class="close-button" id="timer-close-button"></div>
        <p class="header-text">Timer</p>
        <div></div>
      </div>
      <div class="main-window-content">
        <div class="timer-water">
          <div id="water"></div>
        </div>
        <div class="timer-settings">
          <div id="timer-time">5:00</div>
          <div class="timer-controls">
            <p id="timer-start">Start</p>
            <p id="timer-pause">Pause</p>
            <p id="timer-reset">Reset</p>
          </div>
        </div>
      </div>
    </div>

    <div style="display: none" class="window" id="poseidon-browser">
      <div class="window-handle" id="poseidon-browser-handle">
        <div class="close-button" id="poseidon-browser-close-button"></div>
        <p class="header-text">WebSurfer</p>
        <div></div>
      </div>
      <div id="browser-content" class="main-window-content">
        <div class="browser-interface">
          <div class="browser-searchbar">
            <input
              id="browser-input"
              type="text"
              placeholder="Enter a URL..."
            />
            <div id="browser-open">Search</div>
            <div id="browser-button">Open in New Tab</div>
          </div>
          <iframe id="browser-view"></iframe>
        </div>
      </div>
    </div>

    <div style="display: none" class="window" id="poseidon-setting">
      <div class="window-handle" id="poseidon-setting-handle">
        <div class="close-button" id="poseidon-setting-close-button"></div>
        <p class="header-text">Settings</p>
        <div></div>
      </div>
      <div class="main-window-content">
        <label for="desktop-background">Pick a Desktop Background!</label>
        <select
          id="desktop-background"
          onchange="
            document.body.style.backgroundImage =
              'url(./images/' + this.value + ')';
            document.body.style.backgroundSize = 'cover';
          "
        >
          <option value="wallpaper.jpg">Background 1</option>
          <option value="poseidonbg2.jpg">Background 2</option>
          <option value="poseidonbg3.jpg">Background 3</option>
          <option value="poseidonbg4.jpg">Background 4</option>
          <option value="poseidonbg5.jpg">Background 5</option>
          <option value="poseidonbg6.jpg">Background 6</option>
        </select>
        <a
          href="https://github.com/VITNT/PoseiOS"
          target="_blank"
          rel="noopener noreferrer"
          style="cursor: pointer"
          >GitHub Repo</a
        >
      </div>
    </div>

    <!-- pet -->
    <div id="dolphin">
      <div class="dolphin-img">
        <img src="./images/dolphin.png" />
        <p class="dolphin-text">Hm... So-fish-ticated</p>
      </div>
    </div>

    <!-- dock -->
    <div id="dock">
      <div id="poseidon-setting-app">
        <div class="open-button desktop-app" id="setting-open-button__dock">
          <img
            src="./images/settings.png"
            draggable="false"
            alt="settingsLogo"
          />
        </div>
      </div>
      <div id="poseidon-browser-app">
        <div class="open-button desktop-app" id="browser-open-button__dock">
          <img src="./images/browser.png" draggable="false" alt="browserLogo" />
        </div>
      </div>
      <div id="poseidon-md-app">
        <div class="open-button desktop-app" id="poseidon-md-open-button__dock">
          <img src="./images/trident.png" draggable="false" alt="tridentLogo" />
        </div>
      </div>
      <div id="poseidon-book-app">
        <div
          class="open-button desktop-app"
          id="poseidon-book-open-button__dock"
        >
          <img src="./images/book.png" draggable="false" alt="bookLogo" />
        </div>
      </div>
      <div id="poseidon-timer-app">
        <div class="open-button desktop-app" id="timer-open-button__dock">
          <img
            src="./images/sand-clock.png"
            draggable="false"
            alt="timerLogo"
          />
        </div>
      </div>
    </div>
    <!-- script imports -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.ripples@0.6.3/dist/jquery.ripples-min.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/book.js"></script>
    <script src="./scripts/poseidon-md.js"></script>
    <script src="./scripts/browser.js"></script>
    <script src="./scripts/timer.js"></script>
    <script src="./scripts/ripples.js"></script>
  </body>
</html>
